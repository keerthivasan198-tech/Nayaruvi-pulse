<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Pulse"/>
  <meta name="theme-color" content="#020617"/>
  <title>Nayaruvi Pulse – Team Management Console</title>
  <meta name="description" content="Nayaruvi Pulse is a modern team management console for tracking projects, tasks, collaboration, meetings and attendance in real time."/>
  <link rel="manifest" href="data:application/json;charset=utf-8,%7B%22name%22%3A%22Nayaruvi%20Pulse%22%2C%22short_name%22%3A%22Pulse%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23020617%22%2C%22theme_color%22%3A%22%23020617%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fimg.icons8.com%2Fcolor%2F192%2Flightning-bolt.png%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <style>
    :root {
      --bg: #f4f5f6;
      --surface: rgba(255, 255, 255, 0.85);
      --surface-solid: #ffffff;
      --surface-card: #ffffff;
      --border: #e2e8f0;
      --border-focus: #10b981;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.15);
      --accent-hi: #10b981;
      --text: #0f172a;
      --text-muted: #64748b;
      --text-dim: #334155;
      --green: #10b981;
      --amber: #f59e0b;
      --red: #ef4444;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overscroll-behavior: none;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .glass {
      background: var(--surface);
      backdrop-filter: blur(20px) saturate(190%);
      -webkit-backdrop-filter: blur(20px) saturate(190%);
      border: 1px solid var(--border);
    }
    .card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card:hover {
      border-color: rgba(16, 185, 129, 0.25);
      transform: translateY(-1px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
    }
    h1, h2, h3, .font-display {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.12);
      border-radius: 99px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.22);
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    #sidebar {
      width: 260px;
      flex-shrink: 0;
      background: #ffffff;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
      padding-top: calc(var(--safe-top) + 0px);
    }
    @media(max-width: 767px) {
      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100%;
        z-index: 90;
        transform: translateX(-100%);
        width: 80%;
        max-width: 290px;
      }
      #sidebar.open {
        transform: translateX(0);
      }
      #menu-btn {
        display: block !important;
      }
    }
    .nav-section-title {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      padding: 16px 16px 6px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 550;
      color: var(--text-dim);
      transition: all 0.15s ease;
      cursor: pointer;
      border: none;
      background: none;
      width: calc(100% - 16px);
      margin: 2px 8px;
      text-align: left;
      position: relative;
    }
    .nav-item:hover {
      background: rgba(16, 185, 129, 0.05);
      color: #047857;
    }
    .nav-item.active {
      background: rgba(16, 185, 129, 0.08);
      color: #047857;
      font-weight: 600;
    }
    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 6px;
      bottom: 6px;
      width: 3px;
      background: var(--accent-hi);
      border-radius: 0 4px 4px 0;
    }
    #app-header {
      height: 64px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 40;
      padding-top: var(--safe-top);
      display: flex;
      align-items: center;
      padding-left: 16px;
      padding-right: 16px;
      gap: 12px;
    }
    #viewport {
      padding: 20px 16px;
      padding-bottom: calc(88px + var(--safe-bottom));
      max-width: 1280px;
      margin: 0 auto;
    }
    @media(min-width: 768px) {
      #viewport {
        padding: 28px 32px;
        padding-bottom: 40px;
      }
    }
    #bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 60;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      padding-bottom: var(--safe-bottom);
      display: none;
    }
    @media(max-width: 767px) {
      #bottom-nav {
        display: flex;
        justify-content: space-around;
      }
    }
    .bnav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 4px 6px;
      gap: 3px;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.18s;
      border: none;
      background: none;
      position: relative;
    }
    .bnav-item.active {
      color: var(--accent-hi);
    }
    .bnav-item.active svg {
      filter: drop-shadow(0 0 4px rgba(16, 185, 129, 0.25));
    }
    .bnav-item .dot {
      position: absolute;
      top: 6px;
      right: calc(50% - 12px);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-hi);
      border: 1.5px solid #ffffff;
      display: none;
    }
    .bnav-item .dot.show {
      display: block;
    }
    #modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 110;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }
    @media(min-width: 640px) {
      #modal-overlay {
        align-items: center;
        padding: 16px;
      }
    }
    #modal-overlay.show {
      display: flex;
    }
    #modal-content {
      width: 100%;
      max-width: 500px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      max-height: 90vh;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.12);
    }
    @media(min-width: 640px) {
      #modal-content {
        border-radius: 20px;
        transform: scale(0.96) translateY(12px);
        opacity: 0;
        transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s;
      }
    }
    #modal-overlay.show #modal-content {
      transform: translateY(0) scale(1);
      opacity: 1;
    }
    .modal-drag-handle {
      width: 36px;
      height: 4px;
      border-radius: 99px;
      background: rgba(0, 0, 0, 0.1);
      margin: 12px auto 4px;
    }
    #toast {
      position: fixed;
      bottom: calc(76px + var(--safe-bottom) + 12px);
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      z-index: 200;
      background: #ffffff;
      border: 1px solid var(--border);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      white-space: nowrap;
      max-width: 90vw;
      color: var(--text);
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    @media(min-width: 768px) {
      #toast {
        bottom: 24px;
      }
    }
    #login-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 20px;
      padding-top: calc(var(--safe-top) + 20px);
    }
    #sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 85;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    .kanban-col {
      min-height: 280px;
    }
    .ring-track {
      fill: none;
      stroke: rgba(0, 0, 0, 0.05);
      stroke-width: 7;
    }
    .ring-val {
      fill: none;
      stroke: var(--accent-hi);
      stroke-width: 7;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .cal-day {
      min-height: 80px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.6);
      transition: all 0.15s ease;
      cursor: pointer;
    }
    .cal-day.today {
      border-color: rgba(16, 185, 129, 0.4);
      background: rgba(16, 185, 129, 0.05);
    }
    .cal-day.selected {
      border-color: rgba(16, 185, 129, 0.3);
      background: rgba(16, 185, 129, 0.08);
    }
    .cal-day:hover {
      border-color: rgba(16, 185, 129, 0.15);
    }
    .cal-evt {
      font-size: 9px;
      padding: 1.5px 5px;
      border-radius: 999px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-weight: 700;
    }
    .cal-evt.task {
      background: rgba(16, 185, 129, 0.1);
      color: #047857;
    }
    .cal-evt.meeting {
      background: rgba(59, 130, 246, 0.1);
      color: #1d4ed8;
    }
    .cal-evt.milestone {
      background: rgba(245, 158, 11, 0.1);
      color: #b45309;
    }
    .cal-evt.overdue {
      background: rgba(239, 68, 68, 0.1);
      color: #b91c1c;
    }
    .field {
      width: 100%;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      color: var(--text);
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
      font-family: 'Inter', sans-serif;
    }
    .field:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }
    .field::placeholder {
      color: var(--text-muted);
    }
    select.field option {
      background: #ffffff;
      color: var(--text);
    }
    textarea.field {
      resize: vertical;
    }
    label.lbl {
      display: block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    .btn-primary {
      background: var(--accent);
      color: white;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      width: 100%;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .btn-primary:hover {
      background: #059669;
    }
    .btn-primary:active {
      transform: scale(0.98);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-ghost {
      background: transparent;
      color: var(--text-dim);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-ghost:hover {
      background: rgba(16, 185, 129, 0.05);
      color: #047857;
      border-color: rgba(16, 185, 129, 0.2);
    }
    .badge {
      font-size: 10px;
      font-weight: 800;
      padding: 1.5px 7px;
      border-radius: 999px;
      line-height: 1.4;
    }
    .badge-indigo {
      background: rgba(59, 130, 246, 0.1);
      color: #1d4ed8;
      border: 1px solid rgba(59, 130, 246, 0.18);
    }
    .badge-green {
      background: rgba(16, 185, 129, 0.1);
      color: #047857;
      border: 1px solid rgba(16, 185, 129, 0.18);
    }
    .badge-amber {
      background: rgba(245, 158, 11, 0.1);
      color: #b45309;
      border: 1px solid rgba(245, 158, 11, 0.18);
    }
    .badge-red {
      background: rgba(239, 68, 68, 0.1);
      color: #b91c1c;
      border: 1px solid rgba(239, 68, 68, 0.15);
    }
    .badge-slate {
      background: rgba(100, 116, 139, 0.1);
      color: #475569;
      border: 1px solid rgba(100, 116, 139, 0.15);
    }
    .kpi {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.15s ease;
    }
    .kpi:hover {
      border-color: rgba(16, 185, 129, 0.25);
    }
    .kpi-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    #chat-messages {
      height: 45vh;
      overflow-y: auto;
      padding: 16px;
      scroll-behavior: smooth;
    }
    @media(min-width: 768px) {
      #chat-messages {
        height: 58vh;
      }
    }
    .task-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }
    .task-card:hover {
      border-color: rgba(16, 185, 129, 0.25);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
      transform: translateY(-1px);
    }
    .task-card:active {
      transform: scale(0.98);
    }
    .notif-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-hi);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.8);
      flex-shrink: 0;
      margin-top: 4px;
    }
    #viewport {
      animation: fadeUp 0.2s ease;
    }
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    #notif-banner {
      position: fixed;
      top: calc(var(--safe-top) + 8px);
      left: 50%;
      transform: translateX(-50%) translateY(-120%);
      z-index: 300;
      background: #121214;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 350px;
      width: 90vw;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #notif-banner.show {
      transform: translateX(-50%) translateY(0);
    }
    .truncate-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      gap: 10px;
      color: var(--text-muted);
      text-align: center;
    }
    .empty svg {
      opacity: 0.15;
    }
    .empty p {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .sec-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .sec-sub {
      font-size: 12.5px;
      color: var(--text-dim);
      margin-top: 3px;
    }
    .drag-over {
      border-color: var(--accent-hi) !important;
      background: rgba(99, 102, 241, 0.05) !important;
    }
    
    /* Segmented Control / Pill switcher */
    .segmented-control {
      display: inline-flex;
      background: #f1f5f9;
      padding: 3px;
      border-radius: 12px;
      border: 1px solid var(--border);
      gap: 2px;
    }
    .segmented-btn {
      padding: 7px 16px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.15s ease;
      border: none;
      background: transparent;
      white-space: nowrap;
    }
    .segmented-btn:hover {
      color: #047857;
      background: rgba(16,185,129,0.06);
    }
    .segmented-btn.active {
      background: #ffffff;
      color: #047857;
      font-weight: 700;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    /* Priority badges */
    .badge-high { background:rgba(239,68,68,0.1); color:#b91c1c; border:1px solid rgba(239,68,68,0.15); }
    .badge-medium { background:rgba(245,158,11,0.1); color:#b45309; border:1px solid rgba(245,158,11,0.15); }
    .badge-low { background:rgba(16,185,129,0.1); color:#047857; border:1px solid rgba(16,185,129,0.15); }
    /* Status pill */
    .status-todo { background:#f1f5f9; color:#64748b; border:1px solid #e2e8f0; }
    .status-doing { background:rgba(59,130,246,0.08); color:#1d4ed8; border:1px solid rgba(59,130,246,0.15); }
    .status-review { background:rgba(245,158,11,0.08); color:#b45309; border:1px solid rgba(245,158,11,0.15); }
    .status-done { background:rgba(16,185,129,0.08); color:#047857; border:1px solid rgba(16,185,129,0.15); }
    /* Attendance table */
    .att-table { width:100%; font-size:13px; border-collapse:collapse; }
    .att-table th { padding:10px 14px; font-size:10.5px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; text-align:left; border-bottom:2px solid var(--border); background:#f8fafc; }
    .att-table td { padding:12px 14px; border-bottom:1px solid #f1f5f9; color:var(--text-dim); vertical-align:middle; }
    .att-table tr:last-child td { border-bottom:none; }
    .att-table tr:hover td { background:#f8fafc; }
    /* Progress bar */
    .progress-bar { height:6px; background:#e2e8f0; border-radius:999px; overflow:hidden; }
    .progress-fill { height:100%; background:linear-gradient(90deg,#10b981,#059669); border-radius:999px; transition:width 0.4s ease; }
    /* Info card accent */

<script>
/* ================================================================

================================================================ */
const firebaseConfig={apiKey:"AIzaSyB2Ihe-7EovwE2ltQAZW3gawTJuAlx1Zag",authDomain:"pulse-ec78b.firebaseapp.com",databaseURL:"https://pulse-ec78b-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"pulse-ec78b",storageBucket:"pulse-ec78b.firebasestorage.app",messagingSenderId:"290022533964",appId:"1:290022533964:web:6f8c366b1e3c799ed3fde9"};

const db=firebase.firestore();
db.enablePersistence({synchronizeTabs:true}).catch(()=>{});

/* ================================================================
   CONSTANTS
================================================================ */
const LOCAL_USERS={manikandan:{id:"manikandan_uid",username:"manikandan",password:"12345678",name:"Manikandan",role:"lead",email:"manikandang6002@gmail.com",module:"Management",createdAt:new Date().toISOString()}};
const SESSION_KEY="npulse_uid";
const SESSION_USER="npulse_user";
const PROJECT_LIFECYCLE=["Upstream","Proposal","PO Received","Kickoff","Planning","Design","Development","Testing","Deployment","Completed","Closed / Archived"];

/* ================================================================
   STATE
================================================================ */
let S={
  user:null,
  projects:[],users:[],tasks:[],feed:[],milestones:[],
  docs:[],meetings:[],chats:[],notifications:[],attendance:[],deadlines:[],
  projectSummaries:{}, // FIX: store per projectId

  calYear:new Date().getFullYear(),
  calDate:toDateStr(new Date()),
  chatDraft:"",
  aiSummary:{text:"",at:""}
};
let _unsubChats=null,_unsubNotifs=null,_unsubTasks=null;

/* ================================================================
   FIX 1: PROJECT SUMMARY HELPERS (Firebase-backed)
================================================================ */
function getPS(){
  // Returns the summary for the active project, or a default
  const id=S.activeProjectId;
  if(!id)return defaultPS();
  return S.projectSummaries[id]||defaultPS();
}
function defaultPS(){
  return{
    projectName:"",projectOwner:"Manikandan",currentPhase:"Planning",
    targetRelease:"",overallStatus:"on-track",vision:"",weeklyFocus:"",launchGoal:"",
    risks:[],
    roadmap:[
      {id:"r1",phase:"Planning",status:"done",start:"",end:"",description:"Requirement gathering"},
      {id:"r2",phase:"Design",status:"doing",start:"",end:"",description:"UI/UX design"},
      {id:"r3",phase:"Development",status:"todo",start:"",end:"",description:"Frontend & backend"},
      {id:"r4",phase:"Testing",status:"todo",start:"",end:"",description:"QA"},
      {id:"r5",phase:"Deployment",status:"todo",start:"",end:"",description:"Release"}
    ]
  };
}
async function loadProjectSummary(projectId){
  if(!projectId)return;
  try{
    const doc=await db.collection("projectSummaries").doc(projectId).get();
    if(doc.exists){
      S.projectSummaries[projectId]=doc.data();
    } else {
      // Initialize with project name
      const proj=S.projects.find(p=>p.id===projectId);
      const ps=defaultPS();
      if(proj)ps.projectName=proj.name;
      S.projectSummaries[projectId]=ps;
    }
  }catch(e){console.error("loadPS",e);}
}
async function saveProjectSummary(projectId,data){
  if(!projectId)return;
  try{
    await db.collection("projectSummaries").doc(projectId).set(data,{merge:true});
    S.projectSummaries[projectId]=data;
    toast("Summary saved to cloud ✓");
  }catch(e){toast("Save failed: "+e.message);}
}

/* ================================================================
   HELPERS
================================================================ */
function esc(s){if(s==null)return"";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
function toDateStr(d){const dd=new Date(d);if(isNaN(dd.getTime()))return"";return`${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,"0")}-${String(dd.getDate()).padStart(2,"0")}`;}
function todayStr(){return toDateStr(new Date());} // FIX 2: consistent date format
function fmtDT(v){if(!v)return"";const d=new Date(v);if(isNaN(d.getTime()))return"";return d.toLocaleString();}
function fmtDate(v){if(!v)return"";const d=new Date(v);if(isNaN(d.getTime()))return v;return d.toLocaleDateString();}
function fmtTime(v){if(!v)return"";const d=new Date(v);if(isNaN(d.getTime()))return"";return d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});}
function isPast(v){if(!v)return false;return new Date(v).getTime()<Date.now();}
function isToday(v){if(!v)return false;const d=new Date(v);if(isNaN(d.getTime()))return false;return d.toDateString()===new Date().toDateString();}
function greet(){const h=new Date().getHours();return h<12?"Good morning":h<17?"Good afternoon":"Good evening";}

let _toastT=null;
function toast(msg){
  const el=document.getElementById("toast"),m=document.getElementById("toast-msg");
  if(!el||!m)return;
  m.textContent=String(msg||"");
  el.classList.add("show");
  if(_toastT)clearTimeout(_toastT);
  _toastT=setTimeout(()=>el.classList.remove("show"),3500);
}

/* ================================================================
   FIRESTORE HELPERS
================================================================ */
async function fsGet(col){const s=await db.collection(col).get();return s.docs.map(d=>({id:d.id,...d.data()}));}
async function fsGetW(col,f,op,v){const s=await db.collection(col).where(f,op,v).get();return s.docs.map(d=>({id:d.id,...d.data()}));}
async function fsAdd(col,data){const p={...data,createdAt:data.createdAt||new Date().toISOString()};const r=await db.collection(col).add(p);return{id:r.id,...p};}
async function fsUpdate(col,id,data){await db.collection(col).doc(id).update(data);}
async function fsDelete(col,id){await db.collection(col).doc(id).delete();}
async function fsSet(col,id,data){await db.collection(col).doc(id).set(data,{merge:true});}
async function safeGet(col){try{return await fsGet(col);}catch(e){console.warn(col,e.message);return[];}}

async function loadAll(){
  const[projects,users,tasks,feed,milestones,docs,meetings,chats,notifications,attendance,deadlines]=await Promise.all([
    safeGet("projects"),safeGet("users"),safeGet("tasks"),safeGet("feed"),safeGet("milestones"),
    safeGet("docs"),safeGet("meetings"),safeGet("chats"),safeGet("notifications"),safeGet("attendance"),safeGet("deadlines")
  ]);
  S.projects=projects;S.tasks=tasks;S.feed=feed;S.milestones=milestones;
  S.docs=docs;S.meetings=meetings;S.chats=chats;S.notifications=notifications;
  S.attendance=attendance;S.deadlines=deadlines;
  if(S.user&&!users.find(u=>u.id===S.user.id))users.push(S.user);
  S.users=users;
  // FIX 1: Load project summary from Firestore
  if(S.activeProjectId)await loadProjectSummary(S.activeProjectId);
}

/* ================================================================
   FIX 3: PROJECT-SCOPED MEMBER HELPERS
================================================================ */
function getActive(){return S.projects.find(p=>p.id===S.activeProjectId)||null;}

// Returns only users who are members of the active project
function getProjectMembers(){
  const proj=getActive();
  if(!proj)return S.users;
  const ids=new Set(proj.memberIds||[]);
  return S.users.filter(u=>ids.has(u.id));
}

// Returns non-lead members of the active project
function getProjectNonLeads(){
  return getProjectMembers().filter(u=>u.role!=="lead");
}

const isLead=()=>S.user?.role==="lead";
function canModify(item,key="assigneeId"){return!!(isLead()||item?.creatorId===S.user?.id||item?.userId===S.user?.id||item?.[key]===S.user?.id);}
function canManage(proj){return!!(isLead()||proj?.ownerId===S.user?.id);}
function myProjects(){if(!S.user)return[];if(isLead())return S.projects;return S.projects.filter(p=>(p.memberIds||[]).includes(S.user.id));}
const projTasks=()=>S.tasks.filter(t=>t.projectId===S.activeProjectId);
const projFeed=()=>S.feed.filter(f=>f.projectId===S.activeProjectId);
const projMiles=()=>S.milestones.filter(m=>m.projectId===S.activeProjectId);
const projDocs=()=>S.docs.filter(d=>d.projectId===S.activeProjectId);
const projMeetings=()=>S.meetings.filter(m=>m.projectId===S.activeProjectId);
const projChats=()=>S.chats.filter(c=>c.projectId===S.activeProjectId);
const dlOf=t=>t.deadline||t.dueDate||t.date||"";
const msStart=m=>m.startAt||m.datetime||m.date||"";
function myNotifs(){return S.notifications.filter(n=>n.projectId===S.activeProjectId&&(n.userId===S.user?.id||n.userId==="all")&&!(Array.isArray(n.deletedBy)&&n.deletedBy.includes(S.user?.id)));}
function myUnread(){return myNotifs().filter(n=>!n.read);}
function overallProgress(){
  const tasks=projTasks(),miles=projMiles();
  const tp=tasks.length?Math.round(tasks.filter(t=>t.status==="done").length/tasks.length*100):0;
  const mp=miles.length?Math.round(miles.reduce((s,m)=>s+Number(m.progress||0),0)/miles.length):0;
  if(!tasks.length&&!miles.length)return 0;
  if(tasks.length&&miles.length)return Math.round((tp+mp)/2);
  return tasks.length?tp:mp;
}
function healthLabel(){
  const tasks=projTasks();
  const od=tasks.filter(t=>{const dl=dlOf(t);return dl&&t.status!=="done"&&isPast(dl)&&!isToday(dl);}).length;
  const rev=tasks.filter(t=>t.status==="review").length;
  const prog=overallProgress();
  if(od>=5)return{l:"Critical",c:"#f87171"};
  if(od>=2||rev>=4)return{l:"At Risk",c:"#fbbf24"};
  if(prog>=70)return{l:"Healthy",c:"#34d399"};
  return{l:"On Track",c:"#818cf8"};
}
function getCalEventsForDate(ds){
  const items=[];
  projTasks().forEach(t=>{const dl=dlOf(t);if(dl&&toDateStr(dl)===ds){const od=t.status!=="done"&&isPast(dl)&&!isToday(dl);items.push({id:"t"+t.id,type:od?"overdue":"task",title:t.title,subtitle:t.module||"Task",raw:dl});}});
  projMeetings().forEach(m=>{const s=msStart(m);if(s&&toDateStr(s)===ds)items.push({id:"m"+m.id,type:"meeting",title:m.title,subtitle:fmtTime(s),raw:s});});
  projMiles().forEach(ms=>{if(ms.date&&toDateStr(ms.date)===ds)items.push({id:"ms"+ms.id,type:"milestone",title:ms.title,subtitle:`${ms.progress||0}%`,raw:ms.date});});
  return items.sort((a,b)=>new Date(a.raw)-new Date(b.raw));
}
function getUpcoming(days=7){
  const now=new Date(),fut=new Date();fut.setDate(fut.getDate()+days);
  const items=[];
  projTasks().forEach(t=>{const dl=dlOf(t);if(!dl||t.status==="done")return;const d=new Date(dl);if(!isNaN(d)&&d>=now&&d<=fut)items.push({type:"task",title:t.title,date:dl,meta:t.module||"Task"});});
  projMeetings().forEach(m=>{const s=msStart(m);if(!s)return;const d=new Date(s);if(!isNaN(d)&&d>=now&&d<=fut)items.push({type:"meeting",title:m.title,date:s,meta:"Meeting"});});
  projMiles().forEach(ms=>{if(!ms.date)return;const d=new Date(ms.date);if(!isNaN(d)&&d>=now&&d<=fut)items.push({type:"milestone",title:ms.title,date:ms.date,meta:"Milestone"});});
  return items.sort((a,b)=>new Date(a.date)-new Date(b.date));
}
function updateBadges(){

================================================================ */
let _browserNotifEnabled=false;
function browserNotifSupported(){return"Notification"in window;}
function browserNotifOk(){return browserNotifSupported()&&Notification.permission==="granted";}
async function requestBrowserNotif(){
  if(!browserNotifSupported())return toast("Notifications not supported");
  if(Notification.permission==="denied")return toast("Unblock notifications in browser settings");
  const r=await Notification.requestPermission();
  _browserNotifEnabled=r==="granted";
  updateBellIcon();
  if(r==="granted"){sendBrowserNotif("✅ Nayaruvi Pulse","Notifications enabled!");toast("Notifications enabled!");}
  else toast("Notification permission denied");
}
function sendBrowserNotif(title,body){
  if(!browserNotifOk())return;
  try{const n=new Notification(title,{body,icon:"https://img.icons8.com/color/96/lightning-bolt.png",tag:"np-"+Date.now(),requireInteraction:false});n.onclick=()=>{window.focus();n.close();};setTimeout(()=>n.close(),6000);}catch(e){}
}
function updateBellIcon(){
  const btn=document.getElementById("hdr-bell");if(!btn)return;
  if(browserNotifOk()){btn.style.color="#818cf8";btn.title="Notifications ON";}
  else if(browserNotifSupported()&&Notification.permission==="denied"){btn.style.color="#f87171";btn.title="Notifications blocked";}
  else{btn.style.color="var(--text-muted)";btn.title="Enable notifications";}
}
function toggleBrowserNotif(){if(browserNotifOk()){sendBrowserNotif("🔔 Pulse","Notifications are working!");toast("Browser notifications ON ✓");}else requestBrowserNotif();}
let _bannerT=null;
function showInAppBanner(title,body){const el=document.getElementById("notif-banner");document.getElementById("nb-title").textContent=title;document.getElementById("nb-body").textContent=body;el.classList.add("show");if(_bannerT)clearTimeout(_bannerT);_bannerT=setTimeout(()=>hideBanner(),5000);}

/* ================================================================
   NAVIGATION
================================================================ */
function getParentView(view){
  if(["chat","feed","collab"].includes(view)) return "collab";
  if(["summary","team","docs","attendance","projects","manage"].includes(view)) return "manage";
  if(["meetings","milestones","calendar"].includes(view)) return "calendar";
  return view;
}
async function navigate(view){
  if(!S.user)return showLoginScreen();
  closeSidebar();
  const pv = getParentView(view);
  document.querySelectorAll(".nav-item[data-nav],.bnav-item[data-nav]").forEach(b=>{
    b.classList.toggle("active",b.dataset.nav===pv);
  });
  S.view=view;
  try{
    await loadAll();
    render(view);
    if(pv==="collab")await markChatSeen();
    updateHeader();
  }catch(e){toast(e.message||"Error");}
}

/* ================================================================
   RENDER DISPATCH
================================================================ */
function render(view,q=""){
  const el=document.getElementById("viewport");if(!el)return;
  const ms=document.getElementById("main-scroll");if(ms)ms.scrollTop=0;
  el.style.animation="none";el.offsetHeight;el.style.animation="";
  const projectViews=["overview","tasks","mywork","feed","chat","notifications","meetings","team","attendance","calendar","collab","manage"];
  if(projectViews.includes(view)&&!S.activeProjectId){S.view="projects";return rProjects(el,q);}
  switch(view){
    case "projects":S.manageTab="projects";return rManageHub(el,q);
    case "overview":return rOverview(el);
    case "tasks":return rTasks(el,q);
    case "mywork":return rMyWork(el,q);
    case "feed":S.collabTab="feed";return rCollab(el,q);
    case "chat":S.collabTab="chat";return rCollab(el,q);
    case "notifications":return rNotifications(el,q);
    case "team":S.manageTab="team";return rManageHub(el,q);
    case "meetings":S.calendarTab="meetings";return rCalendar(el);
    case "attendance":S.manageTab="attendance";return rManageHub(el,q);
    case "calendar":return rCalendar(el);
    case "collab":return rCollab(el,q);
    case "manage":return rManageHub(el,q);
    default:return rOverview(el);
  }
}

function kpi(label,val,icon,color){
  const colors={indigo:"rgba(99,102,241,.15) #818cf8",emerald:"rgba(34,197,94,.12) #34d399",amber:"rgba(245,158,11,.12) #fbbf24",rose:"rgba(239,68,68,.1) #f87171"};
  const[bg,c]=colors[color]?.split(" ")||["rgba(99,102,241,.15)","#818cf8"];
  return`<div class="kpi"><div class="kpi-icon" style="background:${bg};"><i data-lucide="${esc(icon)}" style="width:20px;height:20px;color:${c};"></i></div><div><p style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin:0 0 2px;">${esc(label)}</p><h3 style="font-family:'Syne',sans-serif;font-size:22px;font-weight:800;margin:0;line-height:1;">${esc(String(val))}</h3></div></div>`;
}
function ring(pct,size=120,label=""){
  const r=size*0.35,circ=2*Math.PI*r,offset=circ-(circ*pct/100),cx=size/2,cy=size/2;
  return`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle class="ring-track" cx="${cx}" cy="${cy}" r="${r}"/><circle class="ring-val" cx="${cx}" cy="${cy}" r="${r}" stroke-dasharray="${circ}" stroke-dashoffset="${offset}" transform="rotate(-90 ${cx} ${cy})"/><text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" style="fill:white;font-family:'Syne',sans-serif;font-weight:800;font-size:${size*0.16}px;">${pct}%</text>${label?`<text x="${cx}" y="${cy+r*0.6}" text-anchor="middle" dominant-baseline="middle" style="fill:var(--text-muted);font-size:${size*0.085}px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;">${esc(label)}</text>`:""}`;
}
function secHead(title,sub,actions=""){return`<div class="sec-head"><div><h2 class="sec-title">${esc(title)}</h2>${sub?`<p class="sec-sub">${esc(sub)}</p>`:""}</div><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">${actions}</div></div>`;}

/* ================================================================
   RENDER: TASKS
================================================================ */
function rTasks(el,q=""){
  const cols=[{id:"todo",label:"Backlog",icon:"list"},{id:"doing",label:"In Progress",icon:"play"},{id:"review",label:"Review",icon:"shield-check"},{id:"done",label:"Done",icon:"package"}];
  const filtered=projTasks().filter(t=>(t.title||"").toLowerCase().includes(q)||(t.module||"").toLowerCase().includes(q));
  el.innerHTML=`
  ${secHead("Kanban Board","Tap any task card to edit details directly",btnPrimary("New Task","openModal('task-create')","plus"))}
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;">
    ${cols.map(col=>{
      const colTasks=filtered.filter(t=>t.status===col.id).sort((a,b)=>{const da=dlOf(a)?new Date(dlOf(a)).getTime():Infinity;const db2=dlOf(b)?new Date(dlOf(b)).getTime():Infinity;return da-db2;});
      return`<div>
        <div style="display:flex;align-items:center;justify-content:space-between;padding:0 4px;margin-bottom:10px;">
          <div style="display:flex;align-items:center;gap:8px;"><i data-lucide="${col.icon}" style="width:14px;height:14px;color:var(--text-muted);"></i><span style="font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);">${col.label}</span></div>
          <span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--text-muted);">${colTasks.length}</span>
        </div>
        <div class="kanban-col" style="background:rgba(15,23,42,.2);border:1px dashed var(--border);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:8px;" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="handleDrop(event,'${col.id}');this.classList.remove('drag-over')">
          ${colTasks.map(t=>taskCard(t)).join("")}
          ${!colTasks.length?`<div style="text-align:center;padding:32px 0;color:var(--text-muted);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;">Empty</div>`:""}
        </div>
      </div>`;
    }).join("")}
  </div>`;
  afterRender();
}

function taskCard(t){
  const pCls=t.priority==="high"?"badge-red":t.priority==="medium"?"badge-amber":"badge-green";
  const assignee=S.users.find(u=>u.id===t.assigneeId)||{name:"Unassigned"};
  const dl=dlOf(t),od=dl&&t.status!=="done"&&isPast(dl)&&!isToday(dl),can=canModify(t),next={todo:"doing",doing:"review",review:"done"}[t.status];
  return`<div class="task-card" onclick="if(!event.target.closest('button')){ openEditTaskModal('${esc(t.id)}'); }" draggable="${can}" ondragstart="${can?`event.dataTransfer.setData('text/plain','${esc(t.id)}')`:'return false'}">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
      <span class="badge ${pCls}">${esc(t.priority||"med")}</span>
      <div style="display:flex;align-items:center;gap:6px;">
        <span style="font-size:10px;color:var(--text-muted);font-weight:700;" title="Assignee">${esc((assignee.name||"U").charAt(0))}</span>
        ${can?`<button onclick="deleteTask('${esc(t.id)}')" style="background:none;border:none;cursor:pointer;color:var(--text-muted);padding:2px;border-radius:4px;" class="hover:bg-rose-500/10 hover:text-rose-400"><i data-lucide="trash-2" style="width:12px;height:12px;"></i></button>`:""}
      </div>
    </div>
    <p style="font-size:13px;font-weight:600;margin:0 0 8px;line-height:1.4;color:var(--text);">${esc(t.title)}</p>
    ${t.description ? `<p style="font-size:11px;color:var(--text-muted);margin:0 0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(t.description)}</p>` : ''}
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      <span class="badge badge-slate">${esc(t.module||"General")}</span>
      ${dl?`<span style="font-size:10px;color:${od?"#f87171":"var(--text-muted)"};">${od?"⚠ ":""}${fmtDate(dl)}</span>`:""}
    </div>
    ${next&&can?`<button onclick="moveTask('${esc(t.id)}','${next}')" style="width:100%;margin-top:10px;padding:7px;background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.2);border-radius:10px;font-size:11px;font-weight:700;color:#818cf8;cursor:pointer;transition:all 0.15s;" class="hover:bg-indigo-600 hover:text-white">Move to ${next==="doing"?"In Progress":next==="review"?"Review":"Done"} →</button>`:""}
  </div>`;
}

          <p style="font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:${status==="todo"?"var(--text-muted)":status==="doing"?"#818cf8":"#34d399"};margin:0 0 10px;">${status==="todo"?"Planned":status==="doing"?"In Progress":"Done"}</p>
          ${road.filter(r=>r.status===status).map(item=>`<div style="background:rgba(2,6,23,.6);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;cursor:${isLead()?"grab":"default"};" draggable="${isLead()}" ondragstart="${isLead()?`dragRoadmap(event,'${esc(item.id)}')`:""}" >
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:6px;"><div><p style="font-size:13px;font-weight:700;margin:0 0 4px;">${esc(item.phase)}</p><p style="font-size:11px;color:var(--text-muted);margin:0;">${esc(item.description||"")}</p></div>${isLead()?`<button onclick="deleteRoadmapItem('${esc(item.id)}')" style="background:none;border:none;cursor:pointer;color:var(--text-muted);padding:2px;"><i data-lucide="x" style="width:12px;height:12px;"></i></button>`:""}</div>
          </div>`).join("")}

        </div>`).join("")}

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">
      <div class="card" style="padding:16px;"><h3 style="font-family:'Syne',sans-serif;font-size:13px;font-weight:700;margin:0 0 8px;">Weekly Focus</h3><p style="font-size:12px;color:var(--text-dim);margin:0;line-height:1.6;">${esc(ps.weeklyFocus||"Not set.")}</p></div>

    <div class="card" style="padding:20px;margin-bottom:16px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;"><h3 style="font-family:'Syne',sans-serif;font-size:15px;font-weight:700;margin:0;display:flex;align-items:center;gap:6px;"><i data-lucide="sparkles" style="width:15px;height:15px;color:#818cf8;"></i>AI Summary</h3><button onclick="refreshAI()" style="font-size:11px;color:#818cf8;background:none;border:none;cursor:pointer;font-weight:700;">Refresh</button></div>
      <div style="background:rgba(15,23,42,.6);border:1px solid var(--border);border-radius:12px;padding:14px;"><p style="font-size:13px;color:var(--text-dim);margin:0;line-height:1.7;white-space:pre-wrap;">${esc(S.aiSummary.text||"Click Refresh to generate.")}</p>${S.aiSummary.at?`<p style="font-size:10px;color:var(--text-muted);margin:8px 0 0;">Generated: ${S.aiSummary.at}</p>`:""}</div>

      <h3 style="font-family:'Syne',sans-serif;font-size:15px;font-weight:700;margin:0 0 12px;color:#f87171;">Risk Register</h3>

      </div>`).join(""):`<div class="empty" style="padding:20px 0;"><p>No risks recorded</p></div>`}
    </div>`;
  }
  else if (S.manageTab === "team") {
    const projMembers = getProjectMembers();
    const list = projMembers.filter(u=>(u.name||"").toLowerCase().includes(q)||(u.role||"").toLowerCase().includes(q));
    tabContent = `
    <div style="margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">

        <i data-lucide="users" style="width:12px;height:12px;color:#059669;"></i>
        <span style="font-size:11.5px;color:#047857;font-weight:700;">${list.length} member${list.length!==1?"s":""} in this project</span>

    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;">
      ${list.length?list.map(u=>{
        const clrArr=["#059669","#0284c7","#7c3aed","#dc2626","#d97706"];
        const clr=clrArr[u.name.charCodeAt(0)%clrArr.length];
        const taskCount=projTasks().filter(t=>t.assigneeId===u.id).length;
        const doneCount=projTasks().filter(t=>t.assigneeId===u.id&&t.status==="done").length;
        return`<div class="card" style="padding:20px;">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">
          <div style="width:46px;height:46px;border-radius:14px;background:${clr}22;border:2px solid ${clr}33;display:flex;align-items:center;justify-content:center;font-family:'Plus Jakarta Sans',sans-serif;font-size:18px;font-weight:800;color:${clr};flex-shrink:0;">${esc((u.name||"U").charAt(0))}</div>
          <div style="min-width:0;">
            <h4 style="font-size:15px;font-weight:700;margin:0 0 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(u.name)}</h4>
            <span class="badge ${u.role==="lead"?"badge-green":"badge-indigo"}">${esc(u.role==="lead"?"Project Lead":"Member")}</span>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:14px;">
          <div style="display:flex;align-items:center;gap:8px;"><i data-lucide="mail" style="width:13px;height:13px;color:#94a3b8;flex-shrink:0;"></i><span style="font-size:12px;color:#475569;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(u.email||u.username+`@nayaruvi.com`)}</span></div>
          <div style="display:flex;align-items:center;gap:8px;"><i data-lucide="briefcase" style="width:13px;height:13px;color:#94a3b8;flex-shrink:0;"></i><span style="font-size:12px;color:#475569;">${esc(u.module||"General")}</span></div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;padding:10px;background:#f8fafc;border-radius:10px;margin-bottom:${isLead()&&u.id!==S.user?.id?"12px":"0"};">
          <span style="font-size:11.5px;color:#64748b;">${taskCount} tasks assigned</span>
          <span class="badge badge-green">${doneCount} done</span>
        </div>
        ${isLead()&&u.id!==S.user?.id?`<button onclick="deleteUser('${esc(u.id)}')" class="btn-ghost" style="width:100%;color:#f87171;border-color:rgba(239,68,68,.2);font-size:12px;">Remove from Project</button>`:""}
      </div>`;
      }).join(""):`<div class="card empty" style="grid-column:1/-1;"><i data-lucide="users" style="width:40px;height:40px;"></i><p>No members in this project</p></div>`}
    </div>`;
  }
  else if (S.manageTab === "attendance") {
    const today=todayStr();
    const myR=S.attendance.find(a=>a.userId===S.user?.id&&a.date===today);
    
    if(!isLead()){
      tabContent = `
      <div style="display:grid;gap:16px;max-width:640px;">
        <div class="card" style="padding:22px;">
          <h3 style="font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:700;margin:0 0 16px;display:flex;align-items:center;gap:8px;"><i data-lucide="clock" style="width:16px;height:16px;color:#059669;"></i>Today – ${today}</h3>
          ${myR
            ?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">
                <div style="background:#f0fdf4;border:1px solid rgba(16,185,129,0.2);border-radius:12px;padding:14px;">
                  <p style="font-size:10px;color:#6b7280;font-weight:700;text-transform:uppercase;margin:0 0 5px;">Check-in</p>
                  <p style="font-size:20px;font-weight:800;color:#059669;margin:0;font-family:'Plus Jakarta Sans',sans-serif;">${esc(myR.checkIn||"—")}</p>
                </div>
                <div style="background:${myR.checkOut?'#fef2f2':'#f8fafc'};border:1px solid ${myR.checkOut?'rgba(239,68,68,0.2)':'#e2e8f0'};border-radius:12px;padding:14px;">
                  <p style="font-size:10px;color:#6b7280;font-weight:700;text-transform:uppercase;margin:0 0 5px;">Check-out</p>
                  <p style="font-size:20px;font-weight:800;color:${myR.checkOut?'#ef4444':'#94a3b8'};margin:0;font-family:'Plus Jakarta Sans',sans-serif;">${esc(myR.checkOut||"—")}</p>
                </div>
              </div>
              ${!myR.checkOut
                ?`<button onclick="checkOut()" style="background:#ef4444;color:white;border:none;border-radius:12px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;width:100%;font-family:'Plus Jakarta Sans',sans-serif;">Check Out</button>`
                :`<div style="background:#f0fdf4;border:1px solid rgba(16,185,129,0.2);border-radius:10px;padding:12px;text-align:center;"><span style="color:#059669;font-size:14px;font-weight:700;">✓ Attendance Marked Complete</span></div>`}`
            :`<div style="background:#f0fdf4;border:1px solid rgba(16,185,129,0.2);border-radius:14px;padding:20px;text-align:center;margin-bottom:4px;">
                <p style="font-size:13px;color:#64748b;margin:0 0 14px;">You haven't checked in yet today</p>
                <button onclick="checkIn()" style="background:#059669;color:white;border:none;border-radius:12px;padding:12px 28px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;">✓ Check In Now</button>
              </div>`}
        </div>
        <div class="card" style="padding:22px;">
          <h3 style="font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:700;margin:0 0 14px;">Daily Work Summary</h3>
          <textarea id="att-summary" rows="4" class="field" placeholder="What did you work on today? Share your progress...">${esc(myR?.summary||"")}</textarea>
          <button onclick="saveSummary()" class="btn-primary" style="margin-top:10px;">${myR?"Update Summary":"Save Summary"}</button>
        </div>
        <div class="card" style="padding:22px;">
          <h3 style="font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:700;margin:0 0 14px;">My History (Last 7 Days)</h3>
          ${(()=>{
            const records=S.attendance.filter(a=>a.userId===S.user?.id).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7);
            if(!records.length)return`<p style="font-size:13px;color:#94a3b8;text-align:center;padding:16px;">No attendance history yet.</p>`;
            return records.map(r=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:8px;">
              <span style="font-size:13px;font-weight:600;color:#0f172a;">${r.date}</span>
              <div style="display:flex;gap:12px;font-size:12px;">
                <span style="color:#059669;font-weight:600;">In: ${r.checkIn||"—"}</span>
                <span style="color:${r.checkOut?'#ef4444':'#94a3b8'};font-weight:600;">Out: ${r.checkOut||"—"}</span>
              </div>
            </div>`).join("");
          })()}
        </div>
      </div>`;
    } else {
      const projMembersList=getProjectNonLeads();
      const todayR=S.attendance.filter(a=>a.date===today&&projMembersList.some(u=>u.id===a.userId));

      const absent=projMembersList.filter(u=>!presentIds.has(u.id));
      tabContent = `
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-bottom:20px;">
        ${kpi("Team Size",projMembersList.length,"users","indigo")}
        ${kpi("Present",todayR.length,"user-check","emerald")}
        ${kpi("Absent",absent.length,"user-x","rose")}
        ${kpi("Active",todayR.filter(r=>r.checkIn&&!r.checkOut).length,"activity","amber")}
      </div>
      <div style="display:grid;gap:16px;">
        <div class="card" style="padding:20px;">
          <h3 style="font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:700;margin:0 0 14px;">Team Attendance – ${today}</h3>
          <div style="overflow-x:auto;">
            <table class="att-table">
              <thead><tr>${["Member","Module","Check-in","Check-out","Status","Summary"].map(h=>`<th>${h}</th>`).join("")}</tr></thead>
              <tbody>
                ${todayR.length?todayR.map(r=>`<tr><td><span style="font-weight:700;color:#0f172a;">${esc(r.userName||"—")}</span></td><td>${esc(r.userModule||"—")}</td><td><span style="font-weight:600;color:#059669;">${esc(r.checkIn||"—")}</span></td><td><span style="font-weight:600;color:${r.checkOut?"#ef4444":"#94a3b8"};">${esc(r.checkOut||"—")}</span></td><td><span class="badge ${r.checkIn&&!r.checkOut?"badge-green":"badge-slate"}">${r.checkIn&&!r.checkOut?"Active":"Done"}</span></td><td style="max-width:200px;" class="truncate-2">${esc(r.summary||"—")}</td></tr>`).join(""):`<tr><td colspan="6" style="text-align:center;padding:32px;color:#94a3b8;">No check-ins recorded today</td></tr>`}
              </tbody>
            </table>
          </div>
        </div>
        ${absent.length?`<div class="card" style="padding:20px;">
          <h3 style="font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:700;margin:0 0 14px;color:#ef4444;">Not Checked In Today (${absent.length})</h3>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;">
            ${absent.map(u=>`<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fef2f2;border:1px solid rgba(239,68,68,0.1);border-radius:12px;">
              <div style="width:32px;height:32px;border-radius:10px;background:rgba(239,68,68,0.08);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#ef4444;flex-shrink:0;">${esc((u.name||"U").charAt(0))}</div>
              <div><p style="font-size:13px;font-weight:600;margin:0;">${esc(u.name)}</p><p style="font-size:11px;color:#94a3b8;margin:1px 0 0;">${esc(u.module||"General")}</p></div>
            </div>`).join("")}
          </div>
        </div>`:""}
        ${todayR.filter(r=>r.summary).length?`<div class="card" style="padding:20px;">
          <h3 style="font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:700;margin:0 0 14px;">Today's Work Summaries</h3>
          ${todayR.filter(r=>r.summary).map(r=>`<div style="padding:14px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:10px;">
            <p style="font-size:12px;font-weight:700;color:#059669;margin:0 0 5px;">${esc(r.userName)}</p>
            <p style="font-size:13px;color:#334155;margin:0;line-height:1.6;">${esc(r.summary)}</p>
          </div>`).join("")}
        </div>`:``}
      </div>`;
    }
  }
  else if (S.manageTab === "projects") {
    const list=myProjects().filter(p=>(p.name||"").toLowerCase().includes(q)||(p.code||"").toLowerCase().includes(q));
    tabContent = `
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;">
      ${list.length?list.map(p=>{
        const members=S.users.filter(u=>(p.memberIds||[]).includes(u.id));
        const stCls=p.status==="active"?"badge-green":p.status==="paused"?"badge-amber":p.status==="completed"?"badge-indigo":"badge-slate";
        const taskCount=S.tasks.filter(t=>t.projectId===p.id).length;
        const doneCount=S.tasks.filter(t=>t.projectId===p.id&&t.status==="done").length;
        const prog=taskCount?Math.round(doneCount/taskCount*100):0;
        return`<div class="card" style="padding:20px;cursor:pointer;overflow:hidden;" onclick="openProjectById('${esc(p.id)}')">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;">
            <span class="badge badge-indigo" style="font-size:9px;letter-spacing:.1em;">${esc(p.code||"PRJ")}</span>
            <span class="badge ${stCls}">${esc(p.status||"active")}</span>
          </div>
          <h3 style="font-family:'Plus Jakarta Sans',sans-serif;font-size:16px;font-weight:700;margin:0 0 6px;">${esc(p.name)}</h3>
          <p style="font-size:12px;color:#64748b;margin:0 0 14px;line-height:1.5;">${esc(p.description||"No description.")}</p>
          <div style="margin-bottom:12px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;">
              <span style="font-size:11px;color:#94a3b8;font-weight:600;">${doneCount}/${taskCount} tasks done</span>
              <span style="font-size:11px;color:#059669;font-weight:700;">${prog}%</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" style="width:${prog}%;"></div></div>
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
            <div style="display:flex;">${members.slice(0,4).map(m=>`<div style="width:26px;height:26px;border-radius:50%;background:#e2e8f0;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#475569;margin-right:-6px;">${esc((m.name||"U").charAt(0))}</div>`).join("")}</div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;" onclick="event.stopPropagation()">
              ${isLead()?`${btnGhost("Members",`openManageMembersModal('${esc(p.id)}')`)}${btnGhost("Edit",`openEditProjectModal('${esc(p.id)}')`)}
              <button onclick="deleteProject('${esc(p.id)}')" class="btn-ghost" style="color:#f87171;border-color:rgba(239,68,68,.2);">Delete</button>`:""}
              <button onclick="openProjectById('${esc(p.id)}')" style="background:#059669;color:white;padding:8px 16px;border-radius:10px;font-size:12px;font-weight:700;border:none;cursor:pointer;">Open →</button>
            </div>
          </div>
        </div>`;
      }).join(""):`<div class="card empty" style="grid-column:1/-1;"><i data-lucide="folders" style="width:48px;height:48px;"></i><p>No projects found</p></div>`}
    </div>`;
  }
  
  el.innerHTML = `
    ${secHead("Workspace Management", "Manage your team, track attendance, and view all projects", headerActions)}
    
    <!-- Tabbed navigation -->
    <div style="margin-bottom:24px;overflow-x:auto;">
      <div class="segmented-control">
        <button class="segmented-btn ${S.manageTab === 'team' ? 'active' : ''}" onclick="S.manageTab='team'; render('manage');"><i data-lucide="users" style="width:13px;height:13px;display:inline;margin-right:5px;"></i>Team</button>
        <button class="segmented-btn ${S.manageTab === 'attendance' ? 'active' : ''}" onclick="S.manageTab='attendance'; render('manage');"><i data-lucide="clock" style="width:13px;height:13px;display:inline;margin-right:5px;"></i>Attendance</button>
        <button class="segmented-btn ${S.manageTab === 'projects' ? 'active' : ''}" onclick="S.manageTab='projects'; render('manage');"><i data-lucide="folders" style="width:13px;height:13px;display:inline;margin-right:5px;"></i>Projects</button>
      </div>
    </div>
    
    <div>
      ${tabContent}
    </div>
  `;
  afterRender();
}

async function createProject(e){
  e.preventDefault();const btn=e.target.querySelector('[type=submit]');btn.disabled=true;
  if(!isLead()){toast("Leads only");btn.disabled=false;return;}
  const fd=new FormData(e.target);
  const name=(fd.get("name")||"").trim(),code=(fd.get("code")||"").trim();
  if(!name||!code){toast("Name and code required");btn.disabled=false;return;}
  try{
    const projObj = {name,code,description:fd.get("description")||"",ownerId:S.user.id,memberIds:[...new Set([S.user.id,...fd.getAll("memberIds")])],status:"active",lifecycleStage:"Upstream",createdAt:new Date().toISOString()};
    const ref=await db.collection("projects").add(projObj);
    // FIX 1: Initialize project summary in Firestore
    const ps={...defaultPS(),projectName:name,projectOwner:S.user.name};
    await db.collection("projectSummaries").doc(ref.id).set(ps);
    await loadAll();closeModal();render("projects");toast("Project created");
    triggerEmailForProjectCreation(projObj);
  }catch(err){toast(err.message||"Failed");}
  btn.disabled=false;
}
async function deleteProject(id){
  if(!confirm("Delete this project and all its data?"))return;
  try{
    await fsDelete("projects",id);
    // Also delete project summary
    try{await fsDelete("projectSummaries",id);}catch(e){}
    for(const col of["tasks","feed","milestones","meetings","chats","notifications","attendance","deadlines","docs"]){
      const items=await fsGetW(col,"projectId","==",id);
      for(const item of items)await fsDelete(col,item.id);
    }
    if(S.activeProjectId===id){S.activeProjectId=null;localStorage.removeItem("npulse_proj");}
    await loadAll();render("projects");toast("Deleted");
  }catch(err){toast(err.message||"Failed");}
}

async function addUser(e){
  e.preventDefault();const btn=e.target.querySelector('[type=submit]');btn.disabled=true;
  if(!isLead()){toast("Leads only");btn.disabled=false;return;}
  const fd=new FormData(e.target);
  const name=(fd.get("name")||"").trim(),username=(fd.get("username")||"").trim().toLowerCase(),password=(fd.get("password")||"").trim(),role=fd.get("role")||"member",module=(fd.get("module")||"").trim(),email=(fd.get("email")||"").trim().toLowerCase();
  if(!name||!username||!password||!module||!email){toast("Fill all fields");btn.disabled=false;return;}
  try{
    const ex=await db.collection("users").where("username","==",username).limit(1).get();
    if(!ex.empty){toast("Username taken");btn.disabled=false;return;}
    const exEmail=await db.collection("users").where("email","==",email).limit(1).get();
    if(!exEmail.empty){toast("Email already registered");btn.disabled=false;return;}
    const uid="u_"+Date.now()+"_"+Math.random().toString(36).slice(2,6);
    const newUser = {id:uid,name,username,password,role,module,email,createdAt:new Date().toISOString()};
    await db.collection("users").doc(uid).set(newUser);
    // Also add user to current project members
    if(S.activeProjectId){
      const proj=getActive();
      if(proj)await fsUpdate("projects",S.activeProjectId,{memberIds:[...new Set([...(proj.memberIds||[]),uid])]});
    }
    await loadAll();closeModal();render("team");toast("Member added & assigned to project");
    triggerEmailForUserInvite(newUser);
  }catch(err){toast(err.message||"Failed");}
  btn.disabled=false;
}
async function deleteUser(id){
  if(!isLead())return toast("Leads only");
  if(!confirm("Remove this user?"))return;
  try{await fsDelete("users",id);await loadAll();render("team");toast("Removed");}catch(e){toast(e.message||"Failed");}
}

async function loginUser(usernameOrEmail,password){
  const u=usernameOrEmail.trim().toLowerCase();
  try{
    let s=await db.collection("users").where("email","==",u).limit(1).get();
    if(s.empty){
      s=await db.collection("users").where("username","==",u).limit(1).get();
    }
    if(!s.empty){
      const doc={id:s.docs[0].id,...s.docs[0].data()};
      if(doc.password!==password)throw new Error("Incorrect password.");
      sessionStorage.setItem(SESSION_KEY,doc.id);
      sessionStorage.setItem(SESSION_USER,JSON.stringify(doc));
      return doc;
    }
  }catch(e){if(e.message==="Incorrect password.")throw e;}
  
  let local=LOCAL_USERS[u];
  if(!local){
    for(const key in LOCAL_USERS){
      if(LOCAL_USERS[key].email.toLowerCase()===u){
        local=LOCAL_USERS[key];
        break;
      }
    }
  }
  if(!local)throw new Error("User not found.");
  if(local.password!==password)throw new Error("Incorrect password.");
  try{await db.collection("users").doc(local.id).set(local);}catch(e){}
  sessionStorage.setItem(SESSION_KEY,local.id);
  sessionStorage.setItem(SESSION_USER,JSON.stringify(local));
  return local;
}

async function loginWithGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  try {
    const result = await firebase.auth().signInWithPopup(provider);
    const gUser = result.user;
    if (!gUser.email) throw new Error("Google account has no email.");
    
    const email = gUser.email.toLowerCase();
    // Check Firestore
    let s = await db.collection("users").where("email", "==", email).limit(1).get();
    let doc = null;
    if (!s.empty) {
      doc = { id: s.docs[0].id, ...s.docs[0].data() };
    } else {
      // Check LOCAL_USERS
      let localKey = null;
      for (const key in LOCAL_USERS) {
        if (LOCAL_USERS[key].email.toLowerCase() === email) {
          localKey = key;
          break;
        }
      }
      if (localKey) {
        doc = LOCAL_USERS[localKey];
        // Save to Firestore
        await db.collection("users").doc(doc.id).set(doc);
      } else {
        // Create a new member user in Firestore
        const uid = "u_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);
        doc = {
          id: uid,
          name: gUser.displayName || email.split("@")[0],
          username: email.split("@")[0],
          password: "google_auth_user",
          role: (email === "manikandang6002@gmail.com") ? "lead" : "member",
          module: "Frontend",
          email: email,
          createdAt: new Date().toISOString()
        };
        await db.collection("users").doc(uid).set(doc);
      }
    }
    
    // Log user in
    S.user = doc;
    sessionStorage.setItem(SESSION_KEY, doc.id);
    sessionStorage.setItem(SESSION_USER, JSON.stringify(doc));
    
    // Load and show app
    await loadAll();
    showApp();
    bindAppEvents();
    startListeners();
    toast("Signed in with Google successfully!");
  } catch (e) {
    console.error("Google login failed", e);
    const er = document.getElementById("login-err");
    if (er) {
      er.textContent = e.message || "Google Sign-in failed.";
      er.style.display = "block";
    }
    toast(e.message || "Google Sign-in failed");
  }
}

function bindLogin(){
  const btn=document.getElementById("login-btn"),uEl=document.getElementById("login-user"),pEl=document.getElementById("login-pass"),er=document.getElementById("login-err");
  const doLogin=async()=>{
    const u=(uEl.value||"").trim(),p=pEl.value;
    er.style.display="none";
    if(!u){er.textContent="Enter email or username";er.style.display="block";uEl.focus();return;}
    if(!p){er.textContent="Enter password";er.style.display="block";pEl.focus();return;}
    btn.disabled=true;btn.innerHTML=`<span class="spinner"></span> Signing in...`;
    try{
      const user=await loginUser(u,p);S.user=user;
      await loadAll();showApp();bindAppEvents();startListeners();
      setTimeout(()=>{if(browserNotifSupported()&&Notification.permission==="default")showNotifPrompt();},2000);
    }catch(e){er.textContent=e.message||"Invalid credentials";er.style.display="block";toast(e.message||"Login failed");}
    btn.disabled=false;btn.innerHTML="Sign in to Workspace";
  };
  btn.addEventListener("click",doLogin);
  pEl.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();doLogin();}});
  uEl.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();pEl.focus();}});

  const gBtn = document.getElementById("google-login-btn");
  if(gBtn){
    gBtn.addEventListener("click", async()=>{
      gBtn.disabled = true;
      const originalText = gBtn.innerHTML;
      gBtn.innerHTML = `<span class="spinner"></span> Connecting Google...`;
      await loginWithGoogle();
      gBtn.disabled = false;
      gBtn.innerHTML = originalText;
    });
  }
}

async function sendEmailNotif(toEmail, subject, htmlMessage) {
  try {
    const url = window.location.protocol.startsWith("http") ? "/api/send-email" : "http://localhost:8000/api/send-email";
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ to: toEmail, subject, message: htmlMessage })
    });
    const result = await res.json();
    if (!result.success) {
      console.error("Email send failed:", result.error);
    }
  } catch (e) {
    console.error("Failed to call email API:", e);
  }
}

/* ================================================================
   APP EVENTS
================================================================ */
function bindAppEvents(){
  document.querySelectorAll("[data-nav]").forEach(btn=>{btn.onclick=()=>navigate(btn.dataset.nav);});
  const search=document.getElementById("global-search");
  if(search){let t=null,last="";search.oninput=e=>{const v=(e.target?.value||"").toLowerCase();if(v===last)return;last=v;clearTimeout(t);t=setTimeout(()=>render(S.view,v),300);};}
  document.getElementById("btn-logout").onclick=()=>{
    if(_unsubChats)_unsubChats();if(_unsubNotifs)_unsubNotifs();if(_unsubTasks)_unsubTasks();
    logout();S.user=null;S.activeProjectId=null;localStorage.removeItem("npulse_proj");showLoginScreen();
  };
}

/* ================================================================
   INIT
================================================================ */
document.addEventListener("DOMContentLoaded",async()=>{
  lucide.createIcons();bindLogin();await seedUser();
  const cached=getSessionUser();
  if(cached){
    S.user=cached;
    try{await loadAll();showApp();bindAppEvents();startListeners();}
    catch(e){showLoginScreen("Session error. Please login.");}
  }else{showLoginScreen();}
});

function onResize(){const hi=document.getElementById("hdr-info");if(hi)hi.style.display=window.innerWidth>=480?"":"none";}
window.addEventListener("resize",onResize);
onResize();
</script>
